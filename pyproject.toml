[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uibe-booker"
version = "0.1.0"
description = "对外经济贸易大学预约助手：图书馆座位 / 研讨间预约命令行工具（IC 信息共享空间系统）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "broncatw" }]
keywords = ["UIBE", "library", "seat", "reservation", "预约"]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
uibe = "uibe_booker.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
